<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexShark - Shark Fisher & Conservation Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ocean: {
                            900: '#030f1c',
                            800: '#071d33',
                            700: '#0b2e4f',
                            600: '#114373',
                            500: '#1d63a6',
                        },
                        shark: {
                            slate: '#1e293b',
                            steel: '#334155',
                            accent: '#06b6d4',
                            warning: '#f59e0b',
                            danger: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>
</head>

                    <i class="fa-solid fa-water text-white text-lg"></i>
                </div>
